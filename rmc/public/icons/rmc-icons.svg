	</symbol>

	<!-- power: bolt in a meter -->
	<symbol viewBox="0 0 24 24" id="icon-rmc-power" fill="none" stroke="#EAB308" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M5 3h14v14H5z"/>
		<path d="M13 6l-4 6h3l-1 5 4-6h-3z"/>
		<path d="M9 21h6M9 17v4M15 17v4"/>
	</symbol>

	<!-- plant status: gauge -->
	<symbol viewBox="0 0 24 24" id="icon-rmc-status" fill="none" stroke="#2DD4BF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M4 18a8 8 0 1 1 16 0"/>
		<path d="M12 18l4.5-4.5"/>
		<path d="M4 18h3M17 18h3"/>
