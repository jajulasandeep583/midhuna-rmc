	<!-- supplier truck -->
	<symbol viewBox="0 0 24 24" id="icon-rmc-supplier" fill="none" stroke="#B91C1C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M2 6h11v10H2z"/>
		<path d="M13 9h4l4 4v3h-8"/>
		<circle cx="6" cy="18" r="1.8"/>
		<circle cx="17" cy="18" r="1.8"/>
	</symbol>

	<!-- guide / book -->
	<symbol viewBox="0 0 24 24" id="icon-rmc-guide" fill="none" stroke="#BE185D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
