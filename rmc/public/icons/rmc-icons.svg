		<path d="M6 15v-2h12v2"/>
		<path d="M8 13V8h8v5"/>
		<path d="M12 8V5"/>
		<path d="M5 21h14"/>
	</symbol>

	<!-- material inward: truck with an arrow in -->
	<symbol viewBox="0 0 24 24" id="icon-rmc-inward" fill="none" stroke="#0D9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M3 16V8h9v8"/>
		<path d="M12 11h4l3 3v2h-7"/>
		<circle cx="7" cy="18" r="1.8"/>
		<circle cx="16" cy="18" r="1.8"/>
		<path d="M7.5 4v4M5.5 6.5 7.5 8.5 9.5 6.5"/>
	</symbol>

