		<path d="M9.5 14a2.5 2.5 0 0 0 2.5 2.5"/>
	</symbol>

	<!-- concrete grade: a poured block with a tag -->
	<symbol viewBox="0 0 24 24" id="icon-rmc-grade" fill="none" stroke="#1D4ED8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M3 9l9-4 9 4-9 4z"/>
		<path d="M3 9v6l9 4 9-4V9"/>
		<path d="M12 13v6"/>
	</symbol>

	<!-- mix design: recipe sheet with measures -->
	<symbol viewBox="0 0 24 24" id="icon-rmc-mix" fill="none" stroke="#059669" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M5 3h11l3 3v15H5z"/>
		<path d="M16 3v3h3"/>
		<path d="M8 11h8M8 14h8M8 17h5"/>
	</symbol>

	<!-- batch production: mixer drum turning -->
	<symbol viewBox="0 0 24 24" id="icon-rmc-batch" fill="none" stroke="#16A34A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
