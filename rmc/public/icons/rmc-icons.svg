<!--
  RMC icon set. Lucide-style 24x24 stroke geometry, one symbol per concept in
  a ready-mix plant. Each carries its own stroke colour so the desk sidebar,
  shortcuts and doctype lists read at a glance instead of sharing one glyph.
-->
<svg id="frappe-symbols" aria-hidden="true" style="display: none;" xmlns="http://www.w3.org/2000/svg">

	<!-- transit mixer: cab, drum, wheels -->
	<symbol viewBox="0 0 24 24" id="icon-rmc-mixer" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M2 16V9h4l2-3h3v10"/>
		<ellipse cx="16" cy="11" rx="5" ry="4.5"/>
		<path d="M13 8.5 19 13.5M13 13.5 19 8.5"/>
		<circle cx="6" cy="18" r="2"/>
		<circle cx="17" cy="18" r="2"/>
		<path d="M8 18h7"/>
	</symbol>

	<!-- concrete pump: boom arm on a truck -->
	<symbol viewBox="0 0 24 24" id="icon-rmc-pump" fill="none" stroke="#7C3AED" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M2 17v-5h9v5"/>
		<circle cx="5" cy="19" r="1.8"/>
		<circle cx="14" cy="19" r="1.8"/>
		<path d="M7 19h5"/>
		<path d="M6 12 11 5l6 2 3 6"/>
		<path d="M20 13v5"/>
	</symbol>

	<!-- batching plant: silos over a mixer house -->
	<symbol viewBox="0 0 24 24" id="icon-rmc-plant" fill="none" stroke="#0F766E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M4 3h5v8H4zM15 3h5v8h-5z"/>
		<path d="M4 11 6.5 15h11L20 11"/>
		<path d="M6.5 15v6h11v-6"/>
		<path d="M10 21v-4h4v4"/>
	</symbol>

	<!-- cement silo -->
	<symbol viewBox="0 0 24 24" id="icon-rmc-silo" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M7 8h10v9H7z"/>
		<path d="M7 8 12 3l5 5"/>
		<path d="M10 17v4h4v-4"/>
		<path d="M7 11h10M7 14h10"/>
	</symbol>

	<!-- cement bag -->
	<symbol viewBox="0 0 24 24" id="icon-rmc-cement" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M7 6c0-1 1-2 2.5-2h5C16 4 17 5 17 6l1.5 13a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2z"/>
		<path d="M9.5 4v3M14.5 4v3"/>
		<path d="M9 12h6"/>
	</symbol>

	<!-- sand pile -->
	<symbol viewBox="0 0 24 24" id="icon-rmc-sand" fill="none" stroke="#D97706" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M2 19h20"/>
		<path d="M4 19 10 8l6 11"/>
		<path d="M13 19l4-7 5 7"/>
	</symbol>

	<!-- coarse aggregate: three stones -->
	<symbol viewBox="0 0 24 24" id="icon-rmc-aggregate" fill="none" stroke="#78716C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M3 18l2.5-4L10 16l-1.5 4z"/>
		<path d="M10 10l3.5-4 4 2.5L15 13z"/>
		<path d="M14 19l2-4 5 1-1 4z"/>
	</symbol>

