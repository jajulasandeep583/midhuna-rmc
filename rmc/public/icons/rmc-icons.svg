	<symbol viewBox="0 0 24 24" id="icon-rmc-dispatch" fill="none" stroke="#DB2777" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M3 16V8h9v8"/>
		<path d="M12 11h4l3 3v2h-7"/>
		<circle cx="7" cy="18" r="1.8"/>
		<circle cx="16" cy="18" r="1.8"/>
		<path d="M7.5 8V4M5.5 5.5 7.5 3.5 9.5 5.5"/>
	</symbol>

	<!-- construction site: crane over a building -->
	<symbol viewBox="0 0 24 24" id="icon-rmc-site" fill="none" stroke="#CA8A04" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M4 21V7l6-3v17"/>
		<path d="M10 10h9v11h-9"/>
		<path d="M13 13h1M16 13h1M13 17h1M16 17h1"/>
		<path d="M4 7h6"/>
	</symbol>

	<!-- customer: office building -->
	<symbol viewBox="0 0 24 24" id="icon-rmc-customer" fill="none" stroke="#4F46E5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
