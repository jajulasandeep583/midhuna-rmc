		<path d="M6 4h12l-3 7H9z"/>
		<path d="M9 11l-2 9M15 11l2 9"/>
		<circle cx="12" cy="15" r="1"/>
		<circle cx="10" cy="19" r="1"/>
		<circle cx="14" cy="18" r="1"/>
	</symbol>

	<!-- admixture: chemical flask -->
	<symbol viewBox="0 0 24 24" id="icon-rmc-admixture" fill="none" stroke="#0891B2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M9 3h6"/>
		<path d="M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"/>
		<path d="M7.5 15h9"/>
	</symbol>

	<!-- water drop -->
	<symbol viewBox="0 0 24 24" id="icon-rmc-water" fill="none" stroke="#0EA5E9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
